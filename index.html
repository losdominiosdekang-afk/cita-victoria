<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#a8d8ff,#d6ecff);
    color:#1b2a41;
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    max-width:600px;
    padding:30px;
}

button{
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:20px;
    background:white;
    color:#1b2a41;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="card">

    <!-- PANTALLA 1 -->
    <div id="pantalla1">
        <h1>❤️ Gracias por la cita de hoy ❤️</h1>
        <p>Tengo algo para ti...</p>

        <button onclick="siguiente()">
            Toca aquí
        </button>
    </div>

    <!-- PANTALLA 2 -->
    <div id="pantalla2" class="hidden">
        <h2>💖</h2>
        <p>
            No es una sorpresa grande...  
            pero sí es importante.
        </p>

        <p>
            Gracias por este día contigo.
            Me quedo con cada momento.
        </p>

        <button onclick="final()">
            Continuar
        </button>
    </div>

    <!-- PANTALLA FINAL -->
    <div id="final" class="hidden">
        <h2>❤️</h2>
        <p>
            Y esto solo es el principio...
        </p>

        <p>
            Gracias por estar en mi vida.
        </p>
    </div>

</div>

<script>
function siguiente(){
    document.getElementById("pantalla1").classList.add("hidden");
    document.getElementById("pantalla2").classList.remove("hidden");
}

function final(){
    document.getElementById("pantalla2").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
}
</script>

</body>
</html>
