<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#a8d8ff,#d6ecff);
    color:#1b2a41;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.card{
    max-width:600px;
    padding:30px;
}

button{
    padding:15px 25px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
    background:white;
    color:#1b2a41;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="card">

    <!-- PANTALLA 1 -->
    <div id="p1">
        <h1>❤️ Gracias por la cita de hoy ❤️</h1>
        <p>Tengo una pregunta para ti...</p>

        <button onclick="showQuestion()">
            Empezar
        </button>
    </div>

    <!-- PANTALLA 2: PREGUNTA -->
    <div id="p2" class="hidden">
        <h2>💭 Pregunta</h2>
        <p>¿Dónde prefieres perderte conmigo?</p>

        <button onclick="wrongAnswer()">
            Cartagena
        </button>

        <button onclick="correctAnswer()">
            Murcia
        </button>

        <p id="msg"></p>
    </div>

    <!-- PANTALLA 3: FINAL -->
    <div id="final" class="hidden">
        <h2>💙</h2>
        <p>
            Buena elección...  
            esto solo acaba de empezar.
        </p>
    </div>

</div>

<script>

function showQuestion(){
    document.getElementById("p1").classList.add("hidden");
    document.getElementById("p2").classList.remove("hidden");
}

function correctAnswer(){
    document.getElementById("p2").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
}

function wrongAnswer(){
    document.getElementById("msg").innerText =
    "Hmm… no estoy seguro de esa respuesta 😏 prueba otra";
}

</script>

</body>
</html>
