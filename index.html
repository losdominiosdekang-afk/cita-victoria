<script>

function lanzarConfeti(){

    confetti({
        particleCount: 80,
        angle: 60,
        spread: 70,
        origin: { x: 0 }
    });

    confetti({
        particleCount: 80,
        angle: 120,
        spread: 70,
        origin: { x: 1 }
    });

}

function lluviaFinal(){

    const duration = 2500;
    const end = Date.now() + duration;

    (function frame(){

        confetti({
            particleCount: 5,
            angle: 60,
            spread: 55,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 5,
            angle: 120,
            spread: 55,
            origin: { x: 1 }
        });

        if(Date.now() < end){
            requestAnimationFrame(frame);
        }

    })();

}

function irPregunta1(){

    document.getElementById("inicio").classList.add("hidden");
    document.getElementById("pregunta1").classList.remove("hidden");

}

function incorrecta(btn,msgId){

    btn.classList.add("shake");

    document.getElementById(msgId).innerText =
    "❌ Esa no es la respuesta correcta.";

    setTimeout(()=>{
        btn.classList.remove("shake");
    },400);

}

function correcta1(btn){

    btn.classList.add("pop");

    lanzarConfeti();

    setTimeout(()=>{

        document.getElementById("pregunta1").classList.add("hidden");
        document.getElementById("pregunta2").classList.remove("hidden");

    },400);

}

function correcta2(btn){

    btn.classList.add("pop");

    lluviaFinal();

    setTimeout(()=>{

        document.getElementById("pregunta2").classList.add("hidden");
        document.getElementById("final").classList.remove("hidden");

    },400);

}

</script>
