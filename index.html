<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti ❤️</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#a8d8ff,#d6ecff);
    color:#1b2a41;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    font-size:20px;
}

.card{
    max-width:650px;
    padding:30px;
}

h1{ font-size:42px; }
h2{ font-size:34px; }
p{ font-size:22px; line-height:1.5; }

button{
    padding:15px 25px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin:10px;
    background:white;
    color:#1b2a41;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
}

/* Animaciones */
.shake {
    animation: shake 0.4s;
}

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-10px); }
    100% { transform: translateX(0); }
}

.pop {
    animation: pop 0.4s ease;
}

@keyframes pop {
    0% { transform: scale(0.8); opacity:0; }
    100% { transform: scale(1); opacity:1; }
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="card">

    <!-- PANTALLA 1 -->
    <div id="p1">
        <h1>❤️ Para ti ❤️</h1>
        <p>He preparado un pequeño juego...</p>
        <button onclick="start()">Empezar</button>
    </div>

    <!-- PANTALLA 2: PREGUNTA -->
    <div id="p2" class="hidden">
        <h2>🎂 Primera prueba</h2>
        <p>¿En qué mes cumplo años?</p>

        <button onclick="wrong(this)">Enero</button>
        <button onclick="wrong(this)">Marzo</button>
        <button onclick="correct(this)">Junio</button>
        <button onclick="wrong(this)">Septiembre</button>

        <p id="msg"></p>
    </div>

    <!-- PANTALLA 3 -->
    <div id="p3" class="hidden">
        <h2 class="pop">💙 ¡Correcto!</h2>
        <p>Vas bien… muy bien 😏</p>

        <button onclick="final()">Continuar</button>
    </div>

    <!-- FINAL -->
    <div id="final" class="hidden">
        <h2>🎁 Premio desbloqueado</h2>

        <p>Has completado la prueba.</p>

        <p>Este es mi número de teléfono:</p>

        <h2>📱 +34 XXX XXX XXX</h2>

        <p>Guárdalo bien 😉</p>
    </div>

</div>

<script>

function start(){
    document.getElementById("p1").classList.add("hidden");
    document.getElementById("p2").classList.remove("hidden");
}

/* ❌ respuesta incorrecta */
function wrong(btn){
    btn.classList.add("shake");

    document.getElementById("msg").innerText =
    "Hmm… no es ese mes 😏";

    setTimeout(() => {
        btn.classList.remove("shake");
    }, 400);
}

/* ✅ respuesta correcta */
function correct(btn){
    btn.classList.add("pop");

    setTimeout(() => {
        document.getElementById("p2").classList.add("hidden");
        document.getElementById("p3").classList.remove("hidden");
    }, 400);
}

function final(){
    document.getElementById("p3").classList.add("hidden");
    document.getElementById("final").classList.remove("hidden");
}

</script>

</body>
</html>
